name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build CLI
        run: swift build --product clipboard-archive

      - name: Build menu bar app target
        run: swift build --product ClipboardArchiveMenuBar

      - name: Run test suite
        run: swift test

      - name: Run core checks
        run: swift run --quiet clipboard-archive-checks

      - name: Package release
        run: ./scripts/package-release.sh

      # The folder name follows the newest CHANGELOG entry; never a literal.
      - name: Name the release folder
        run: |
          . scripts/lib/release-identity.sh
          read -r version build <<<"$(release_identity_newest CHANGELOG.md)"
          echo "RELEASE_DIR=releases/ClipboardArchive-${version}-macos-$(uname -m)" >> "$GITHUB_ENV"

      - name: Validate release
        run: ./scripts/validate-release.sh "$RELEASE_DIR"

      - name: Check local-only boundary
        run: ./scripts/check-local-only.sh "$RELEASE_DIR"

      - name: Test install locations
        run: ./scripts/test-install-locations.sh

      - name: Test that an update keeps history, settings and data location
        run: ./scripts/test-upgrade-keeps-data.sh

      - name: Test failed-update rollback
        run: ./scripts/test-install-rollback.sh "$RELEASE_DIR"

      - name: Test release refusals, notes, leak scan and gate
        run: ./scripts/test-release.sh

      - name: Build the disk image release
        run: ./scripts/release.sh --out "$RUNNER_TEMP/dmg-release"

      - name: Test an update from build N to N+1
        run: ./scripts/test-update-e2e.sh
