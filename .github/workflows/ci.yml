name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build CLI
        run: swift build --product clipboard-archive

      - name: Build menu bar app target
        run: swift build --product ClipboardArchiveMenuBar

      - name: Run test suite
        run: swift test

      - name: Run core checks
        run: swift run --quiet clipboard-archive-checks

      - name: Package release
        run: ./scripts/package-release.sh

      - name: Validate release
        run: ./scripts/validate-release.sh "releases/ClipboardArchive-0.2.0-macos-$(uname -m)"

      - name: Check local-only boundary
        run: ./scripts/check-local-only.sh "releases/ClipboardArchive-0.2.0-macos-$(uname -m)"

      - name: Test failed-update rollback
        run: ./scripts/test-install-rollback.sh "releases/ClipboardArchive-0.2.0-macos-$(uname -m)"
